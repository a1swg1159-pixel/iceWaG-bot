[project]
name = "qq-bot"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "nonebot2>=2.2.0",
  "nonebot-adapter-onebot>=2.2.0"
]

[tool.nonebot]
plugins = []
plugin_dirs = ["src/plugins"]
builtin_plugins = []
adapters = [
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
